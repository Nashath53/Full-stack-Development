<!DOCTYPE html>
<html>

<head>

    <title>javascript test</title>

</head>

<body>
    <input id="inputbox" onkeydown="update()">
    <h1 id="result"></h1>

    <div>



    </div>
    <script>
        var inputbox = document.getElementById("inputbox")
        var result = document.getElementById("result")

        function update() {
            result.textContent = inputbox.value

        }

    </script>

</body>

</html>
