<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tutor for students</title>
  </head>
  <body>
    <div class="container">
      <h1>STUDENT FORM</h1>
      
      <label>Name</label>
      <input type="text" id="name"/><br />
      <label>Age</label>
      <input type="number" id="age"/><br />
      <label>Gender</label>
      <input type="radio" name="Gender"  value="male"/><span style="
          font-family:
            &quot;Gill Sans&quot;, &quot;Gill Sans MT&quot;, Calibri,
            &quot;Trebuchet MS&quot;, sans-serif;">Male</span>
      <input type="radio" name="Gender" value="female" /><span style="
          font-family:
            &quot;Gill Sans&quot;, &quot;Gill Sans MT&quot;, Calibri,
            &quot;Trebuchet MS&quot;, sans-serif;">Female</span><br />

      <label>Subject</label>
      <select id="Course"
        style="font-family:
            &quot;Gill Sans&quot;, &quot;Gill Sans MT&quot;, Calibri,
            &quot;Trebuchet MS&quot;, sans-serif;">
        <option>Maths</option>
        <option>I.C.T</option>
        <option>Second-language-sinhala</option></select><br />
      <label>E-mail</label>
      <input type="email" id="email"/><br />
      <button class="savebtn" onclick="save_content()">save</button>
    </div>

    <div>
      <table  >
        <thead>
        <tr>
          <th>NAME</th>
          <th>AGE</th>
          <th>GENDER</th>
          <th>COURSE</th>
          <th>EMAIL</th>
          <th>ACTION</th>
        </tr>
        </thead>
        <tbody id="tablebody"></tbody>
      </table>
    </div>

  <script src="script.js"></script>
  </body>
</html>
