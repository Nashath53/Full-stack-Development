<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List with jQuery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            
        }
        .container{
            width: 400px;
            place-content: center;
            margin: 0 auto;
            background-color: #200d0d;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            color: white;
            text-align: center;
        }
        input[type=text]{
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
            margin-right: 10px;
        }
        button{
            margin-top: 10px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover{
            background-color: #1b5a1e;
        }
        .remove{
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove:hover{
            background-color: #7a1717;
        }
        .edit{
            background-color: rgb(49, 86, 165);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .edit:hover{
            background-color:rgb(32, 65, 136);
        }
        ul{
            list-style-type: none;
            padding: 0;
        }
        li{
            padding: 10px;
            width: 90%;
            background-color: rgba(36, 27, 27, 0.945);
            margin-bottom: 5px;
            border-radius: 5px;
            border: 1px solid #fff;
            display: inline-flex;
            justify-content:space-between;
            align-items: center;
        }
        li div{
            display: flex;
            gap: 10px;
        }
        
        
    </style>
</head>
<body>
    <div class="container">

    <h1>ToDo List</h1>
    <input type="text" id="input_content" placeholder="Enter a task">
    <button id="add_task">Add Task</button>
    <h3>Task List</h3>
    <ul id="list">
    </ul>
    </div>
    
    <script>
        $(document).ready(function(){

            var remove_item = '<button class="remove">Delete</button>';
            var edit_item = '<button class="edit">Edit</button>';

            $('#add_task').click(function(){
                var task = $('#input_content').val().trim();

                if(task){
                    $('#list').prepend(
                        '<li><span>' + task + '</span><div>' +
                        edit_item + remove_item + '</div></li>'
                    );
                    $('#input_content').val('');
                }
            });

            $('#list').on('click', '.remove', function(){ 
                
                $(this).closest('li').remove();
            });

            $('#list').on('click', '.edit', function(){
                var taskText = $(this).closest('li').children('span').first();
                var updatedTask = prompt('Edit task:', taskText.text());

                if(updatedTask !== null && updatedTask.trim() !== ''){
                    taskText.text(updatedTask.trim());
                }
            });
        });
    </script>
</body>
</html>
